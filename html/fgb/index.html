<!DOCTYPE html>
<html>
<head>
    <title>FlatGeobuf in Leaflet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/flatgeobuf@3.23.0/dist/flatgeobuf-geojson.min.js"></script>
</head>
<body>
    <div id="map" style="height: 600px;"></div>
    <script>
        var map = L.map('map').setView([41.9, 12.5], 6); // Centra l'Italia

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        async function loadFlatGeobuf() {
            const url = 'https://aborruso.github.io/blackboard/data/flatgeobuf/GEOSTAT_grid_POP_1K_IT_2011.fgb'; // Sostituisci con il tuo URL
            try {
                for await (const feature of flatgeobuf.deserialize(url)) {
                    console.log(feature); // Debug: stampa ogni feature nel console
                    L.geoJSON(feature).addTo(map);
                }
            } catch (error) {
                console.error('Errore durante il caricamento del file FlatGeobuf:', error);
            }
        }

        loadFlatGeobuf();
    </script>
</body>
</html>
